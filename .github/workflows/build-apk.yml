name: Build MushokuFoldRoxy APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android API 36
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Roxy artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files=['roxy_wallpaper.jpg','roxy_scene_02.jpeg','roxy_scene_03.jpg','roxy_scene_04.jpg','roxy_scene_05.jpg']
          root=Path('app/src/main/res/drawable-nodpi')
          for f in files:
              d=(root/f).read_bytes(); assert d[:2]==b'\xff\xd8' and d[-2:]==b'\xff\xd9', f'{f}: invalid JPEG'
              print(f,len(d),hashlib.sha256(d).hexdigest())
          b=(root/'roxy_wallpaper.jpg').read_bytes(); assert len(b)==281677
          assert hashlib.sha256(b).hexdigest()=='515eb6b0b09b3b9c276635bcce70423aa33462ac44ce63dca0ff0a41aade1967'
          PY
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MushokuFoldRoxy-v0.8.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MushokuFoldRoxy-v0.8.0-debug
          path: app/build/outputs/apk/debug/MushokuFoldRoxy-v0.8.0-debug.apk
